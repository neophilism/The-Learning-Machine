name: one-time-browser-lock-bootstrap
on:
  push:
    branches: [feature/tlm-007-accessible-shell]
permissions:
  contents: write
jobs:
  lock:
    if: github.repository == 'neophilism/The-Learning-Machine'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tlm-007-accessible-shell
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --lockfile-only
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - name: Commit verified lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "build: lock browser test and web integrations"
            git push origin HEAD:feature/tlm-007-accessible-shell
          fi
